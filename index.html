<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#000000">

<title>Mini Phone</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="phone">

  <!-- ================================
       실제 측면 전원 버튼
       ================================ -->

  <button
    id="powerButton"
    aria-label="전원 버튼"
    type="button"
  ></button>


  <!-- ================================
       상태바
       ================================ -->

  <div id="statusBar">

    <span id="statusTime">
      12:00
    </span>

    <span id="statusIcons">
      📶 🔋
    </span>

  </div>


  <!-- ================================
       빠른 설정
       ================================ -->

  <div id="quickPanel">

    <div class="quickHandle"></div>

    <div class="quickHeader">
      빠른 설정
    </div>

    <div class="brightnessBox">

      <span>☀️</span>

      <input
        id="brightness"
        type="range"
        min="30"
        max="100"
        value="100"
      >

    </div>


    <div class="quickGrid">

      <button
        class="quickButton"
        id="wifiButton"
        type="button"
      >
        <span>📶</span>
        <small>Wi-Fi</small>
      </button>


      <button
        class="quickButton"
        id="airplaneButton"
        type="button"
      >
        <span>✈️</span>
        <small>비행기 모드</small>
      </button>


      <button
        class="quickButton"
        id="flashButton"
        type="button"
      >
        <span>🔦</span>
        <small>손전등</small>
      </button>


      <button
        class="quickButton"
        id="soundButton"
        type="button"
      >
        <span>🔊</span>
        <small id="soundText">소리</small>
      </button>

    </div>

  </div>


  <!-- ================================
       화면
       ================================ -->

  <main id="screen">

    <!-- ================================
         잠금 화면
         ================================ -->

    <section
      id="lockScreen"
      class="page lockScreen hidden"
    >

      <div
        class="lockTime"
        id="lockTime"
      >
        12:00
      </div>

      <div
        class="lockDate"
        id="lockDate"
      ></div>


      <!-- PIN 잠금 -->

      <div id="pinUnlock">

        <div class="lockMessage">
          PIN을 입력하세요
        </div>

        <input
          id="unlockPin"
          type="password"
          inputmode="numeric"
          maxlength="6"
          autocomplete="off"
        >

        <button
          id="unlockPinButton"
          type="button"
        >
          잠금 해제
        </button>

      </div>


      <!-- 패턴 잠금 -->

      <div
        id="patternUnlock"
        class="hidden"
      >

        <div class="lockMessage">
          패턴을 그리세요
        </div>

        <div
          id="unlockBoard"
          class="patternBoard"
        >

          <canvas></canvas>

          <i data-index="0"></i>
          <i data-index="1"></i>
          <i data-index="2"></i>

          <i data-index="3"></i>
          <i data-index="4"></i>
          <i data-index="5"></i>

          <i data-index="6"></i>
          <i data-index="7"></i>
          <i data-index="8"></i>

        </div>

      </div>

    </section>


    <!-- ================================
         홈
         ================================ -->

    <section
      id="homePage"
      class="page"
    >

      <div
        class="homeClock"
        id="homeClock"
      >
        12:00
      </div>

      <div
        class="homeDate"
        id="homeDate"
      ></div>


      <div class="appGrid">

        <button
          class="appIcon"
          data-app="phone"
          type="button"
        >
          <span>📞</span>
          <label>전화</label>
        </button>


        <button
          class="appIcon"
          data-app="camera"
          type="button"
        >
          <span>📷</span>
          <label>카메라</label>
        </button>


        <button
          class="appIcon"
          data-app="gallery"
          type="button"
        >
          <span>🖼️</span>
          <label>갤러리</label>
        </button>


        <button
          class="appIcon"
          data-app="memo"
          type="button"
        >
          <span>📝</span>
          <label>메모</label>
        </button>


        <button
          class="appIcon"
          data-app="clock"
          type="button"
        >
          <span>🕐</span>
          <label>시계</label>
        </button>


        <button
          class="appIcon"
          data-app="settings"
          type="button"
        >
          <span>⚙️</span>
          <label>설정</label>
        </button>

      </div>

    </section>


    <!-- ================================
         전화
         ================================ -->

    <section
      id="phonePage"
      class="page appPage hidden"
    >

      <div class="appHeader">

        <button
          class="backApp"
          type="button"
        >
          ‹
        </button>

        <h2>전화</h2>

      </div>


      <div class="phoneBody">

        <input
          id="phoneNumber"
          type="tel"
          inputmode="tel"
          placeholder="전화번호"
        >

        <button
          id="callButton"
          type="button"
        >
          📞 전화 걸기
        </button>

        <div id="callResult"></div>

      </div>

    </section>


    <!-- ================================
         카메라
         ================================ -->

    <section
      id="cameraPage"
      class="page appPage hidden"
    >

      <div class="appHeader">

        <button
          class="backApp"
          type="button"
        >
          ‹
        </button>

        <h2>카메라</h2>

      </div>


      <div class="cameraBody">

        <video
          id="cameraVideo"
          autoplay
          playsinline
          muted
        ></video>

        <canvas
          id="photoCanvas"
        ></canvas>


        <div class="cameraControls">

          <button
            id="startCamera"
            type="button"
          >
            카메라 켜기
          </button>


          <button
            id="takePhoto"
            type="button"
          >
            ●
          </button>


          <button
            id="stopCamera"
            type="button"
          >
            카메라 끄기
          </button>

        </div>

      </div>

    </section>


    <!-- ================================
         갤러리
         ================================ -->

    <section
      id="galleryPage"
      class="page appPage hidden"
    >

      <div class="appHeader">

        <button
          class="backApp"
          type="button"
        >
          ‹
        </button>

        <h2>갤러리</h2>

      </div>


      <button
        id="deleteAllPhotos"
        class="dangerButton"
        type="button"
      >
        전체 삭제
      </button>


      <div id="galleryGrid"></div>

    </section>


    <!-- ================================
         사진 확대
         ================================ -->

    <div
      id="photoViewer"
      class="hidden"
    >

      <button
        id="closePhotoViewer"
        type="button"
      >
        ×
      </button>

      <img
        id="viewerImage"
        alt="사진"
      >

      <button
        id="deleteCurrentPhoto"
        type="button"
      >
        삭제
      </button>

    </div>


    <!-- ================================
         메모
         ================================ -->

    <section
      id="memoPage"
      class="page appPage hidden"
    >

      <div class="appHeader">

        <button
          class="backApp"
          type="button"
        >
          ‹
        </button>

        <h2>메모</h2>

      </div>


      <button
        id="newMemoButton"
        class="primaryButton"
        type="button"
      >
        ＋ 새 메모
      </button>


      <div id="memoList"></div>

    </section>


    <!-- ================================
         메모 작성/수정
         ================================ -->

    <section
      id="memoEditPage"
      class="page appPage hidden"
    >

      <div class="appHeader">

        <button
          id="memoEditBack"
          type="button"
        >
          ‹
        </button>

        <h2>메모 작성</h2>

      </div>


      <input
        id="memoTitle"
        placeholder="제목"
      >


      <textarea
        id="memoContent"
        placeholder="내용을 입력하세요"
      ></textarea>


      <div class="memoEditButtons">

        <button
          id="saveMemo"
          class="primaryButton"
          type="button"
        >
          저장
        </button>


        <button
          id="deleteMemo"
          class="dangerButton"
          type="button"
        >
          삭제
        </button>

      </div>

    </section>


    <!-- ================================
         시계
         ================================ -->

    <section
      id="clockPage"
      class="page appPage hidden"
    >

      <div class="appHeader">

        <button
          class="backApp"
          type="button"
        >
          ‹
        </button>

        <h2>시계</h2>

      </div>


      <div
        id="bigClock"
        class="bigClock"
      >
        12:00:00
      </div>


      <div
        id="bigDate"
        class="bigDate"
      ></div>

    </section>


    <!-- ================================
         설정
         ================================ -->

    <section
      id="settingsPage"
      class="page appPage hidden"
    >

      <div class="appHeader">

        <button
          class="backApp"
          type="button"
        >
          ‹
        </button>

        <h2>설정</h2>

      </div>


      <!-- 잠금 -->

      <div class="settingItem">

        <strong>
          잠금 설정
        </strong>

        <span id="lockStatus">
          잠금 없음
        </span>


        <div class="settingButtons">

          <button
            id="setPin"
            type="button"
          >
            PIN 설정
          </button>


          <button
            id="setPattern"
            type="button"
          >
            패턴 설정
          </button>


          <button
            id="removeLock"
            type="button"
          >
            잠금 해제
          </button>

        </div>

      </div>


      <!-- 배경 -->

      <div class="settingItem">

        <strong>
          배경화면
        </strong>


        <div class="backgroundButtons">

          <button
            data-bg="default"
            type="button"
          >
            기본
          </button>

          <button
            data-bg="blue"
            type="button"
          >
            파랑
          </button>

          <button
            data-bg="purple"
            type="button"
          >
            보라
          </button>

          <button
            data-bg="green"
            type="button"
          >
            초록
          </button>

        </div>

      </div>

    </section>


    <!-- ================================
         최근 앱
         ================================ -->

    <section
      id="recentPage"
      class="page appPage hidden"
    >

      <div class="appHeader">

        <h2>
          최근 앱
        </h2>

      </div>


      <div id="recentList"></div>


      <button
        id="clearRecent"
        class="dangerButton"
        type="button"
      >
        최근 앱 모두 지우기
      </button>

    </section>

  </main>


  <!-- ================================
       PIN 설정창
       ================================ -->

  <div
    id="pinSetupOverlay"
    class="overlay hidden"
  >

    <div class="overlayBox">

      <h2 id="pinSetupTitle">
        PIN 설정
      </h2>

      <p id="pinSetupDescription">
        4~6자리 PIN을 입력하세요.
      </p>


      <input
        id="setupPinInput"
        type="password"
        inputmode="numeric"
        maxlength="6"
        placeholder="새 PIN"
        autocomplete="off"
      >


      <input
        id="setupPinConfirm"
        type="password"
        inputmode="numeric"
        maxlength="6"
        placeholder="PIN 다시 입력"
        autocomplete="off"
      >


      <button
        id="confirmPinSetup"
        type="button"
      >
        확인
      </button>

    </div>

  </div>


  <!-- ================================
       패턴 설정창
       ================================ -->

  <div
    id="patternSetupOverlay"
    class="overlay hidden"
  >

    <div class="overlayBox">

      <h2>
        패턴 설정
      </h2>

      <p>
        점을 드래그해서 연결하세요.
      </p>


      <div
        id="setupBoard"
        class="patternBoard"
      >

        <canvas></canvas>

        <i data-index="0"></i>
        <i data-index="1"></i>
        <i data-index="2"></i>

        <i data-index="3"></i>
        <i data-index="4"></i>
        <i data-index="5"></i>

        <i data-index="6"></i>
        <i data-index="7"></i>
        <i data-index="8"></i>

      </div>


      <button
        id="confirmPattern"
        type="button"
      >
        패턴 저장
      </button>

    </div>

  </div>


  <!-- ================================
       현재 잠금 확인창
       ================================ -->

  <div
    id="verifyLockOverlay"
    class="overlay hidden"
  >

    <div class="overlayBox">

      <button
        id="closeVerifyLock"
        class="overlayCloseButton"
        type="button"
      >
        ×
      </button>


      <h2>
        현재 잠금 확인
      </h2>

      <p>
        현재 설정된 잠금을 입력하세요.
      </p>


      <!-- PIN 확인 -->

      <input
        id="verifyPin"
        type="password"
        inputmode="numeric"
        maxlength="6"
        placeholder="현재 PIN"
        autocomplete="off"
      >


      <!-- 패턴 확인 -->

      <div
        id="verifyBoard"
        class="patternBoard hidden"
      >

        <canvas></canvas>

        <i data-index="0"></i>
        <i data-index="1"></i>
        <i data-index="2"></i>

        <i data-index="3"></i>
        <i data-index="4"></i>
        <i data-index="5"></i>

        <i data-index="6"></i>
        <i data-index="7"></i>
        <i data-index="8"></i>

      </div>


      <button
        id="verifyLockButton"
        type="button"
      >
        확인
      </button>

    </div>

  </div>


  <!-- ================================
       전원 OFF 화면
       ================================ -->

  <div
    id="powerOffOverlay"
    class="powerOverlay hidden"
  ></div>


  <!-- ================================
       하단 네비게이션
       ================================ -->

  <nav id="bottomNav">

    <button
      id="recentNav"
      type="button"
    >
      <span>▣</span>
      <small>최근</small>
    </button>


    <button
      id="homeNav"
      type="button"
    >
      <span>●</span>
      <small>홈</small>
    </button>


    <button
      id="backNav"
      type="button"
    >
      <span>‹</span>
      <small>뒤로</small>
    </button>

  </nav>

</div>


<script src="script.js"></script>

</body>
</html>
